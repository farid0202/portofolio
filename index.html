<script>
const T=THREE,$=s=>document.querySelector(s);

// ---------- helpers ----------
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};

const box=(g,w,h,d,c,x,y,z)=>{const m=new T.Mesh(new T.BoxGeometry(w,h,d),M(c));m.position.set(x,y+h/2,z);g.add(m);return m};
function tex(b,v,rx,ry){const c=document.createElement("canvas");c.width=c.height=16;const x=c.getContext("2d");
  for(let i=0;i<16;i++)for(let j=0;j<16;j++){const n=Math.floor(Math.random()*v);x.fillStyle=`rgb(${b[0]+n},${b[1]+n},${b[2]+n})`;x.fillRect(i,j,1,1)}
  const t=new T.CanvasTexture(c);t.magFilter=T.NearestFilter;t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rx,ry);return t}

// ---------- ground ----------
const grass=new T.MeshLambertMaterial({map:tex([62,140,52],34,60,60)}),dirt=new T.MeshLambertMaterial({map:tex([118,84,54],28,60,2)});
const ground=new T.Mesh(new T.BoxGeometry(120,4,120),[dirt,dirt,grass,dirt,dirt,dirt]);ground.position.y=-2;scene.add(ground);

// ---------- buildings ----------
function house(g){box(g,6,3.2,5,0xb8854f,0,0,0);box(g,7,.6,6,0x8a3b2e,0,3.2,0);box(g,5,.6,4.6,0x8a3b2e,0,3.8,0);box(g,3,.6,3,0x8a3b2e,0,4.4,0);
  box(g,1.2,2,.2,0x4a2e1a,0,0,2.55);box(g,1,1,.2,0x9fd8ff,-2,1.2,2.55);box(g,1,1,.2,0x9fd8ff,2,1.2,2.55);box(g,1,2.2,1,0x777b78,2,3.2,-1)}

  box(g,1.2,2,.2,0x4a2e1a,0,0,2.05);[3.5,6.5,9.5].forEach(y=>box(g,1,1.4,.2,0xffd36b,0,y,2.05));box(g,1.4,1.4,.2,0x6b4930,-1.2,2.4,2.1)}

  [3.5,3.05,2.6].forEach((y,i)=>box(g,3.4-i*.5,.2,.35,0xf1f0d9,0,y,.1))}

const S=[
 {id:"about",x:-24,z:-8,f:villa,ly:9,R:5.6,t:"🏡 Modern Villa"},

 else{p.fillStyle="#355d38";p.fillRect(0,0,240,240);const R=["hhhhhhhh","hhhhhhhh","hssssssh","swpsspws","ssssssss","sssmmsss","ssmmmmss","ssssssss"],K={h:"#3b2a1a",s:"#c58c5f",w:"#ffffff",p:"#3a5fcf",m:"#7a4a32"};R.forEach((row,j)=>[...row].forEach((c,i)=>{p.fillStyle=K[c];p.fillRect(i*30,j*30,30,30)}))}
 x.fillStyle="#172820";x.fillRect(0,0,560,328);x.fillStyle="#b5f477";x.fillRect(24,34,252,252);x.drawImage(portrait,30,40);
 x.fillStyle="#f1f0d9";x.font="24px 'Press Start 2P',monospace";x.fillText("FARID",300,95);x.fillText("MUSTHOFA",300,135);

 x.fillStyle="#75d66b";x.fillRect(300,236,236,50);x.fillStyle="#102016";x.font="10px 'Press Start 2P',monospace";x.fillText("KLIK UNTUK KENALAN",316,266);bt.needsUpdate=true}
drawBoard();if(document.fonts)document.fonts.load("24px 'Press Start 2P'").then(drawBoard);
if(PHOTO){photo=new Image();photo.onload=drawBoard;photo.src=PHOTO}
// ---------- bangunan modern ----------
const neon=(g,w,h,d,c,x,y,z)=>{const m=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshBasicMaterial({color:c}));m.position.set(x,y+h/2,z);g.add(m)};
box(scene,11,.1,11,0xcfd3d6,0,0,0);box(scene,7,.12,7,0x9aa0a6,0,0,0);

 box(g,5,2.2,.12,0x9fd8ff,-.5,.7,2.05);box(g,4.2,1.8,.12,0x9fd8ff,1,3.8,2.28);box(g,6.2,.25,5.2,0xeeeeee,1,6.1,0);
 box(g,1,3,.15,0xb8854f,-3.2,.3,2.05);box(g,1,2.2,.12,0x2b2f36,2.2,.3,2.05);neon(g,3,.1,2,0x3fc1f0,-2.8,.3,3.2);box(g,.8,.8,.8,0x3f9a4e,3.8,.3,3.2)}

 for(let i=1;i<8;i++)box(g,4.8,.25,4.8,0xcfd3d6,0,2+i*2,0);
 [-2.3,2.3].forEach(x=>[-2.3,2.3].forEach(z=>box(g,.3,16,.3,0x2b2f36,x,2,z)));

 neon(g,6,.25,.15,0x3df5ff,0,3.1,3.15);neon(g,1.2,.8,.1,0x3df5ff,-2,1.2,3.15);neon(g,1.2,.8,.1,0xb86bff,0,1.2,3.15);neon(g,1.2,.8,.1,0x75d66b,2,1.2,3.15);
 box(g,3,2.4,3,0xe4572e,5.8,0,-.5);box(g,3,2.4,3,0x2f6fb3,5.8,2.4,-.5)}
function kiosk(g){box(g,4.4,.4,1.4,0xcfd3d6,0,0,0);box(g,.5,2.6,.5,0x2b2f36,0,.4,0);box(g,5,2.8,.3,0x2b2f36,0,3,0);
 neon(g,4.6,2.4,.1,0x0f5d4a,0,3.2,.18);neon(g,3.2,.22,.1,0xb5f477,0,5,.24);neon(g,2.4,.16,.1,0xf1f0d9,0,4.5,.24);neon(g,2.8,.16,.1,0xf1f0d9,0,4,.24);neon(g,1.6,.16,.1,0xf1f0d9,0,3.5,.24)}

 neon(g,.12,5,.12,0xb86bff,-1.7,.3,.3);neon(g,.12,5,.12,0xb86bff,1.7,.3,.3);neon(g,3.4,.12,.12,0xb86bff,0,5.5,.3);
 const p=new T.Mesh(new T.PlaneGeometry(3.4,5.2),new T.MeshBasicMaterial({color:0x9b3df0,transparent:true,opacity:.8,side:T.DoubleSide}));p.position.y=2.9;g.add(p);g.userData.glow=p}
function billboard(g){[-3,3].forEach(x=>box(g,.6,4,.6,0x6b4930,x,0,0));box(g,7.6,4.6,.5,0x2b1f14,0,3,0);
 const f=new T.Mesh(new T.PlaneGeometry(7,4.1),new T.MeshBasicMaterial({map:bt}));f.position.set(0,5.3,.26);g.add(f);
 [-2.5,2.5].forEach(x=>box(g,.4,.4,.4,0xffe08a,x,7.6,.5))}
S.forEach(s=>{const g=new T.Group();s.f(g);g.position.set(s.x,0,s.z);g.rotation.y=Math.atan2(-s.x,-s.z);g.userData.id=s.id;scene.add(g);groups.push(g);s.g=g;avoid.push([s.x,s.z,s.A||7]);
  const D=Math.hypot(s.x,s.z),d=D-(s.E||6.5),q=d/D,p=new T.Mesh(new T.BoxGeometry(3,.06,d),M(0x3a3f46));p.position.set(s.x*q/2,.03,s.z*q/2);p.rotation.y=Math.atan2(s.x,s.z);scene.add(p);s.d=d;for(let t=3;t<d-2;t+=3.5){const l=new T.Mesh(new T.BoxGeometry(.15,.07,1.4),M(0xeeeeee));l.position.set(s.x*t/D,.04,s.z*t/D);l.rotation.y=p.rotation.y;scene.add(l)}});

// ---------- trees & clouds ----------
for(let i=0;i<190;i++){const x=rnd()*112-56,z=rnd()*112-56;if(avoid.some(a=>Math.hypot(x-a[0],z-a[1])<a[2])||S.some(s=>{const d=Math.hypot(s.x,s.z),t=Math.max(0,Math.min(1,(x*s.x+z*s.z)/(d*d)));return Math.hypot(x-s.x*t,z-s.z*t)<3.4}))continue;
  const g=new T.Group(),k=.8+rnd()*.6;box(g,1,3,1,0x6b4930,0,0,0);box(g,3,2,3,rnd()>.5?0x3f9a4e:0x358a45,0,3,0);box(g,2,1,2,0x4cae5a,0,5,0);g.position.set(x,0,z);g.scale.setScalar(k);scene.add(g)}

// ---------- content ----------
const chips=a=>`<div class="chips">${a.map(x=>`<span class="chip">${x}</span>`).join("")}</div>`;

const keys={},joy={x:0,y:0},cD=new T.Color(0x8ecbff),cN=new T.Color(0x0b1030),cT=new T.Color(),nearP=$('#prompt'),seen=new Set();

const jb=$('#joy'),kn=$('#knob');

function stepWorld(dt){

(function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05),tm=clock.elapsedTime;
